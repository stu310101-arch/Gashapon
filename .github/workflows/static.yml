name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build React app
        id: build
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_path }}/
        run: |
          build_script=$(node -p "require('./package.json').scripts?.build || ''")

          case "$build_script" in
            *"vite build"*)
              npm run build -- --base="$PUBLIC_URL"
              folder=dist
              ;;
            *"react-scripts build"*)
              npm run build
              folder=build
              ;;
            *)
              echo "::error::無法辨認打包指令，請檢查 package.json 裡的 scripts.build"
              exit 1
              ;;
          esac

          test -f "$folder/index.html"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Upload built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.build.outputs.folder }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
